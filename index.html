<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Happy Birthday Pama</title>
    <link
        rel="stylesheet"
        href="style.css"
    >

</head>

<body>

    <div class="page">
        <h1 class="title">
            A very important delivery... 💚
        </h1>
        <div
            class="envelope-container"
            id="envelope"
        >
            <div class="envelope">
                <div
                    class="card-wrapper"
                    id="cardWrapper"
                >
                    <div
                        class="card"
                        id="card"
                    >

                        <div class="card-page page-3">
                            <div class="message">

                                <img
                                    src="https://media1.tenor.com/m/3QZ8t4gW3GQAAAAC/birthday-cat.gif"
                                    alt="Birthday cats"
                                    class="birthday-gif"
                                >

                                <h2>
                                    It relishes
                                    <br>
                                    in it!
                                </h2>
                            </div>
                        </div>

                        <div class="card-page page-2">
                            <div class="message">
                                <div class="heart">
                                    
                                </div>
                                <h2>
                                    How does a pickle celebrate 
                                    its birthday? 
                                </h2>
                            </div>
                            <div class="page-next">Tap for next →</div>
                        </div>

                        <div class="card-page page-1">
                            <div class="message">
                                <div class="heart">
                                    🎂
                                </div>
                                <p class="dear">
                                    Dear Pama,
                                </p>
                                <p>
                                    Happy Birthday!
                                    Hope you have a
                                    fabulous day! 🎉
                                </p>
                                <p class="love">
                                    Love Mel 💕
                                </p>
                            </div>
                            <div class="page-next">Tap for next →</div>
                        </div>

                        <div class="card-front">
                            <div class="front-content">
                                <div
                                    class="birthday-words"
                                    id="birthdayWords"
                                >
                                    <div class="word">
                                        <span>H</span>
                                        <span>A</span>
                                        <span>P</span>
                                        <span>P</span>
                                        <span>Y</span>
                                    </div>
                                    <div class="word">
                                        <span>B</span>
                                        <span>I</span>
                                        <span>R</span>
                                        <span>T</span>
                                        <span>H</span>
                                        <span>D</span>
                                        <span>A</span>
                                        <span>Y</span>
                                    </div>
                                    <div class="word">
                                        <span>P</span>
                                        <span>A</span>
                                        <span>M</span>
                                        <span>A</span>
                                    </div>
                                </div>
                                <div class="tap-card">
                                    Tap to open 💌
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="envelope-back">
                </div>
                <div class="envelope-flap">
                </div>
                <div class="envelope-front">
                    <div class="envelope-heart">
                        💚
                    </div>
                    <p>
                        For Pama
                    </p>
                </div>
            </div>
        </div>
        <p
            class="instructions"
            id="instructions"
        >
            Tap the envelope to open 💌
        </p>
    </div>
    <div
        class="confetti-container"
        id="confetti"
    >
    </div>
    <script src="script.js"></script>
</body>

</html>
